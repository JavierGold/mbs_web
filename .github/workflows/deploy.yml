name: Publicar MBS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No interrumpir una publicación entre subida de assets y subida de index.html.
concurrency:
  group: mbs-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.MBS_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ fromJSON(vars.MBS_DEPLOY_CONFIG || '{}').region }}
      AWS_ACCOUNT_ID: ${{ fromJSON(vars.MBS_DEPLOY_CONFIG || '{}').account_id }}
      AWS_ROLE_ARN: ${{ fromJSON(vars.MBS_DEPLOY_CONFIG || '{}').role_arn }}
      S3_BUCKET: ${{ fromJSON(vars.MBS_DEPLOY_CONFIG || '{}').bucket }}
      CF_DISTRIBUTION_ID: ${{ fromJSON(vars.MBS_DEPLOY_CONFIG || '{}').distribution_id }}
      SITE_URL: ${{ fromJSON(vars.MBS_DEPLOY_CONFIG || '{}').site_url }}
    steps:
      - name: Validar configuración
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ACCOUNT_ID AWS_ROLE_ARN S3_BUCKET CF_DISTRIBUTION_ID SITE_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Falta $name en MBS_DEPLOY_CONFIG. Consulta infra/terraform/github-deploy.md"
              exit 1
            fi
          done
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Optimizar gráficos sin pérdida
        run: |
          python -m pip install Pillow==12.0.0
          python scripts/optimize-hero-images.py .
      - name: Instalar y compilar
        run: |
          npm ci
          npm run build
          if [ -d img ]; then
            mkdir -p dist/img
            cp -a img/. dist/img/
          fi
          test -s dist/index.html
          test -s dist/img/mainframe.webp
          test -s dist/img/servicios.webp
          test -s dist/img/nosotros.webp
          test -s dist/img/university.webp
          test -s dist/img/contactos.webp
      - name: Obtener credenciales temporales OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: mbs-${{ github.run_id }}
          role-duration-seconds: 1800
      - name: Subir assets y publicar HTML al final
        shell: bash
        run: |
          set -euo pipefail
          if [ -d dist/assets ]; then
            aws s3 cp dist/assets/ "s3://$S3_BUCKET/assets/" --recursive --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          fi
          aws s3 cp dist/ "s3://$S3_BUCKET/" --recursive --exclude 'assets/*' --exclude 'index.html' --cache-control 'public,max-age=300' --only-show-errors
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" --content-type 'text/html; charset=utf-8' --cache-control 'no-cache,max-age=0,must-revalidate' --only-show-errors
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$CF_DISTRIBUTION_ID" --id "$INVALIDATION_ID"
          printf 'Publicado commit `%s` en %s\n' "$GITHUB_SHA" "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
